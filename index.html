
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Live 抽獎工具 V8</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#101827;color:#f5f7fb;font-family:Arial,"Noto Sans TC",sans-serif}
main{max-width:950px;margin:auto}
h1{font-size:28px}
.panel{background:#1c293b;border:1px solid #34445c;border-radius:14px;padding:20px;margin:16px 0}
button,input{font:inherit;border-radius:8px;padding:11px;border:0}
button{background:#3679ed;color:white;cursor:pointer;margin:5px 5px 5px 0}
button:disabled{opacity:.45;cursor:not-allowed}
input{background:#f5f7fb;color:#172033;max-width:100%;width:100%}
.status{color:#9fc1ff;overflow-wrap:anywhere}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.big{font-size:28px;font-weight:bold}
#chat{height:300px;overflow:auto;background:#101827;padding:12px;border-radius:8px}
.msg{padding:8px 4px;border-bottom:1px solid #29364a;overflow-wrap:anywhere}
.muted{color:#aab6c8;font-size:13px}
#winner{font-size:30px;color:#ffd166;font-weight:bold;min-height:42px}
.good{color:#7ee0a0}
</style>
</head>
<body>
<main>

<h1>🎉 YouTube Live 抽獎工具</h1>
<p class="muted">V8｜直播留言自動保存與接續收集</p>

<section class="panel">
<h2>① 連接 YouTube</h2>
<p>直播網址</p>
<input id="videoUrl" value="https://www.youtube.com/watch?v=J4GbKrMOWMA">

<br><br>
<button onclick="login()">Google 登入／授權</button>
<button id="connect" onclick="connectLive()" disabled>連接這場直播</button>
<button onclick="disconnect()">中斷連線</button>

<p id="status" class="status">尚未登入</p>
<p id="broadcast" class="muted"></p>
<p id="savedStatus" class="muted">尚無保存資料</p>
</section>

<section class="panel">
<h2>② 抽獎設定</h2>
<p>參加關鍵字</p>
<input id="keyword" value="抽獎">
<p class="muted">留言包含關鍵字即可參加，同一 YouTube 頻道帳號只計算一次。</p>
<button onclick="applyKeyword()">套用關鍵字並重新統計</button>
</section>

<section class="panel">
<h2>③ 即時統計</h2>
<div class="stats">
<div><div class="muted">已收集留言</div><div class="big" id="messageCount">0</div></div>
<div><div class="muted">符合資格人數</div><div class="big" id="participantCount">0</div></div>
</div>
</section>

<section class="panel">
<h2>④ 聊天室留言</h2>
<div id="chat"><span class="muted">連接直播後，留言會顯示在這裡。</span></div>
</section>

<section class="panel">
<h2>⑤ 抽出得獎者</h2>
<button id="draw" onclick="drawWinner()" disabled>🎲 隨機抽獎</button>
<button onclick="exportExcel()">📥 匯出 Excel 名單</button>
<button onclick="exportAllMessages()">📥 匯出全部已收集留言</button>
<div id="winner"></div>
<div id="winnerInfo" class="muted"></div>
</section>

<section class="panel">
<h2>⑥ 資料管理</h2>
<p class="muted">資料會保存在目前瀏覽器。清除瀏覽器資料或更換裝置，可能無法取回。</p>
<button onclick="clearSavedData()">清除本機保存資料</button>
</section>

</main>

<script>
const CLIENT_ID =
"903719977286-l7q5q3pk7asj4pjmp5ntj087lighl7jg.apps.googleusercontent.com";
const SCOPE =
"https://www.googleapis.com/auth/youtube.readonly";
const API_BASE =
"https://www.googleapis.com/youtube/v3/";
const MAX_MESSAGES = 5000;

let tokenClient = null;
let accessToken = null;
let liveChatId = null;
let currentVideoId = null;
let timer = null;
let nextPageToken = null;
let pollInterval = 5000;
let messageCount = 0;
let participants = new Map();
let allMessages = [];
let seenMessageIds = new Set();
let isPolling = false;

const $ = id => document.getElementById(id);

function setStatus(text){
  $("status").textContent = text;
}

function storageKey(videoId){
  return "yt_giveaway_v8_" + videoId;
}

// 保存目前直播資料
function saveData(){
  if(!currentVideoId)return;

  const data = {
    videoId:currentVideoId,
    liveChatId:liveChatId,
    nextPageToken:nextPageToken,
    messageCount:messageCount,
    messages:allMessages.slice(-MAX_MESSAGES),
    savedAt:new Date().toISOString()
  };

  try{
    localStorage.setItem(storageKey(currentVideoId),JSON.stringify(data));
    $("savedStatus").textContent =
      "✓ 已自動保存｜"+allMessages.length+" 則留言｜"+
      new Date().toLocaleTimeString();
  }catch(error){
    $("savedStatus").textContent =
      "保存空間不足，請匯出 Excel 備份資料。";
  }
}

// 載入之前保存的資料
function loadData(videoId){
  try{
    const raw = localStorage.getItem(storageKey(videoId));
    if(!raw)return false;

    const data = JSON.parse(raw);

    if(data.videoId !== videoId)return false;

    liveChatId = data.liveChatId || null;
    nextPageToken = data.nextPageToken || null;
    messageCount = data.messageCount || 0;
    allMessages = Array.isArray(data.messages) ? data.messages : [];

    seenMessageIds = new Set(
      allMessages.map(m=>m.id).filter(Boolean)
    );

    rebuildParticipants();

    $("chat").innerHTML="";
    allMessages.slice(-200).forEach(showMessage);

    $("savedStatus").textContent =
      "已恢復保存資料："+allMessages.length+" 則留言";

    updateStats();
    return true;

  }catch(error){
    console.error(error);
    return false;
  }
}

function login(){
  if(!window.google?.accounts?.oauth2){
    setStatus("Google 登入元件載入中，請稍候再試。");
    return;
  }

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID,
    scope:SCOPE,
    callback:response=>{
      if(response.error){
        setStatus("登入失敗："+response.error);
        return;
      }

      accessToken = response.access_token;
      $("connect").disabled = false;
      setStatus("Google 授權成功，可以連接直播了。");
    }
  });

  tokenClient.requestAccessToken();
}

async function api(path,params={}){
  if(!accessToken)throw new Error("請先登入 Google。");

  const url = new URL(API_BASE + path);

  Object.entries(params).forEach(([k,v])=>{
    url.searchParams.set(k,v);
  });

  let response;

  try{
    response = await fetch(url,{
      headers:{Authorization:"Bearer "+accessToken}
    });
  }catch(error){
    throw new Error("網路連線失敗，請檢查網路或瀏覽器設定。");
  }

  const data = await response.json();

  if(!response.ok){
    const reason = data.error?.errors?.[0]?.reason || "";
    throw new Error(
      (data.error?.message || "YouTube API 錯誤")+
      (reason ? "（"+reason+"）" : "")
    );
  }

  return data;
}

function getVideoId(value){
  try{
    const url = new URL(value.trim());

    if(url.hostname==="youtu.be"){
      return url.pathname.slice(1);
    }

    if(url.hostname.includes("youtube.com")){
      return url.searchParams.get("v") ||
        url.pathname.split("/").filter(Boolean).pop();
    }
  }catch(error){}

  return value.trim();
}

async function connectLive(){
  if(!accessToken){
    setStatus("請先登入 Google。");
    return;
  }

  stopPolling();

  try{
    const videoId = getVideoId($("videoUrl").value);

    if(!videoId){
      setStatus("請輸入有效的直播網址。");
      return;
    }

    currentVideoId = videoId;

    setStatus("正在查詢直播……");

    const videoData = await api("videos",{
      part:"snippet,liveStreamingDetails",
      id:videoId
    });

    if(!videoData.items?.length){
      setStatus("找不到這支影片，請檢查網址。");
      return;
    }

    const video = videoData.items[0];
    const foundChatId =
      video.liveStreamingDetails?.activeLiveChatId;

    if(!foundChatId){
      setStatus("目前沒有可用的即時聊天室，請確認直播正在進行且聊天室已開啟。");
      return;
    }

    $("broadcast").textContent =
      "目前直播："+video.snippet.title;

    // 如果是同一場直播，恢復保存資料
    const restored = loadData(videoId);

    // 只有保存的聊天室 ID 與目前直播相同才沿用 Token
    if(!restored || liveChatId !== foundChatId){
      liveChatId = foundChatId;
      nextPageToken = null;
      allMessages = [];
      seenMessageIds.clear();
      messageCount = 0;
      participants.clear();
      $("chat").innerHTML="";
      updateStats();
    }

    liveChatId = foundChatId;
    saveData();

    $("draw").disabled = participants.size===0;

    setStatus(
      restored && nextPageToken
      ? "已恢復之前的資料，正在接續收集新留言……"
      : "已連接聊天室，開始收集留言……"
    );

    await pollChat();

  }catch(error){
    setStatus("連接失敗："+error.message);
  }
}

function rebuildParticipants(){
  participants.clear();

  const keyword = $("keyword").value.trim().toLowerCase();
  if(!keyword)return;

  for(const msg of allMessages){
    if(
      msg.text.toLowerCase().includes(keyword) &&
      !participants.has(msg.channelId)
    ){
      participants.set(msg.channelId,msg);
    }
  }

  updateStats();
}

function applyKeyword(){
  const keyword = $("keyword").value.trim();

  if(!keyword){
    setStatus("請輸入參加關鍵字。");
    return;
  }

  rebuildParticipants();
  saveData();

  setStatus("已重新統計關鍵字："+keyword);
}

async function pollChat(){
  if(!liveChatId || !accessToken || isPolling)return;

  isPolling = true;

  try{
    const params = {
      liveChatId:liveChatId,
      part:"snippet,authorDetails",
      maxResults:"200"
    };

    if(nextPageToken){
      params.pageToken = nextPageToken;
    }

    // 正確 API 路徑
    const data = await api("liveChat/messages",params);

    nextPageToken = data.nextPageToken || null;
    pollInterval = Math.max(data.pollingIntervalMillis || 5000,1000);

    for(const item of (data.items || [])){
      if(seenMessageIds.has(item.id))continue;

      seenMessageIds.add(item.id);

      const author = item.authorDetails || {};
      const snippet = item.snippet || {};
      const channelId = author.channelId || author.displayName;
      const text = snippet.displayMessage || "";

      const msg = {
        id:item.id,
        channelId:channelId,
        name:author.displayName || "未知使用者",
        text:text,
        time:snippet.publishedAt || new Date().toISOString()
      };

      messageCount++;
      allMessages.push(msg);

      if(allMessages.length>MAX_MESSAGES){
        const removed = allMessages.shift();
        if(removed?.id)seenMessageIds.delete(removed.id);
      }

      showMessage(msg);

      const keyword = $("keyword").value.trim().toLowerCase();

      if(
        keyword &&
        text.toLowerCase().includes(keyword) &&
        !participants.has(channelId)
      ){
        participants.set(channelId,msg);
      }
    }

    updateStats();
    $("draw").disabled = participants.size===0;

    saveData();

    setStatus("聊天室連線正常，持續收集留言中。");

    isPolling = false;
    timer = setTimeout(pollChat,pollInterval);

  }catch(error){
    isPolling = false;
    setStatus("讀取聊天室失敗："+error.message);
    timer = setTimeout(pollChat,10000);
  }
}

function showMessage(msg){
  const el = document.createElement("div");
  el.className="msg";

  const name = document.createElement("strong");
  name.textContent=msg.name+"：";

  const content = document.createElement("span");
  content.textContent=msg.text;

  el.append(name,content);
  $("chat").appendChild(el);
  $("chat").scrollTop=$("chat").scrollHeight;

  while($("chat").children.length>200){
    $("chat").removeChild($("chat").firstChild);
  }
}

function updateStats(){
  $("messageCount").textContent=messageCount;
  $("participantCount").textContent=participants.size;
}

function drawWinner(){
  const list = Array.from(participants.values());

  if(!list.length){
    $("winner").textContent="目前沒有符合資格的參加者";
    $("winnerInfo").textContent="";
    return;
  }

  const winner = list[Math.floor(Math.random()*list.length)];

  $("winner").textContent="🎉 "+winner.name;
  $("winnerInfo").textContent="留言：「"+winner.text+"」";
}

function exportExcel(){
  if(!window.XLSX){
    alert("Excel 元件尚未載入，請稍後再試。");
    return;
  }

  const rows = Array.from(participants.values()).map((p,i)=>({
    "編號":i+1,
    "YouTube 名稱":p.name,
    "留言內容":p.text,
    "留言時間":p.time,
    "頻道 ID":p.channelId
  }));

  if(!rows.length){
    alert("目前沒有符合資格的參加者。");
    return;
  }

  const sheet = XLSX.utils.json_to_sheet(rows);
  const book = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(book,sheet,"抽獎名單");
  XLSX.writeFile(book,"YouTube直播抽獎名單.xlsx");
}

function exportAllMessages(){
  if(!window.XLSX){
    alert("Excel 元件尚未載入。");
    return;
  }

  if(!allMessages.length){
    alert("目前沒有已保存的留言。");
    return;
  }

  const rows = allMessages.map((p,i)=>({
    "編號":i+1,
    "YouTube 名稱":p.name,
    "留言內容":p.text,
    "留言時間":p.time,
    "頻道 ID":p.channelId
  }));

  const sheet = XLSX.utils.json_to_sheet(rows);
  const book = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(book,sheet,"全部留言");
  XLSX.writeFile(book,"YouTube直播全部留言.xlsx");
}

function stopPolling(){
  if(timer)clearTimeout(timer);
  timer=null;
}

function disconnect(){
  stopPolling();

  // 保留本機資料，不刪除已保存的留言
  saveData();

  liveChatId=null;
  accessToken=null;
  tokenClient=null;
  isPolling=false;

  $("connect").disabled=true;
  $("draw").disabled=participants.size===0;

  setStatus("已中斷連線，已收集資料仍保存在本機。");
}

function clearSavedData(){
  if(!currentVideoId){
    alert("請先連接過一場直播。");
    return;
  }

  if(!confirm("確定清除這場直播在本機保存的所有資料？此動作無法復原。")){
    return;
  }

  localStorage.removeItem(storageKey(currentVideoId));

  stopPolling();

  liveChatId=null;
  nextPageToken=null;
  messageCount=0;
  allMessages=[];
  participants.clear();
  seenMessageIds.clear();

  $("chat").innerHTML='<span class="muted">保存資料已清除。</span>';
  $("savedStatus").textContent="尚無保存資料";

  updateStats();
  $("draw").disabled=true;

  setStatus("本機保存資料已清除。");
}

// 頁面關閉前盡量保存目前資料
window.addEventListener("beforeunload",()=>{
  saveData();
});
</script>

</body>
</html>
